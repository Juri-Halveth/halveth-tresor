name: Download the Windows build
description: Read this workflow run's artifact after upload, allowing for delayed lookup.
inputs:
  path:
    description: Destination directory
    required: true
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Tresor-windows
        path: ${{ inputs.path }}
    - if: steps.first.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 10
    - if: steps.first.outcome == 'failure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Tresor-windows
        path: ${{ inputs.path }}
