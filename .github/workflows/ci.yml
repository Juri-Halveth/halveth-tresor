name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check release labels
        run: python scripts/check_release.py
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=tresor --cov-report=term-missing

  build:
    name: Build Windows executable
    needs: [ lint, test ]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked release dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --locked --extra dev --python 3.12
      - name: Check canonical release version
        run: uv run --no-sync python scripts/check_release.py
      - name: Build executable
        run: uv run --no-sync python -m PyInstaller packaging/tresor.spec --clean --noconfirm
      - name: Check actual Windows version resource
        shell: pwsh
        run: |
          $version = uv run --no-sync python scripts/check_release.py
          $actual = (Get-Item dist/Tresor.exe).VersionInfo
          if ($actual.FileVersion -ne $version -or $actual.ProductVersion -ne $version) { throw 'Executable version mismatch' }
      - name: Compute SHA-256
        run: (Get-FileHash dist/Tresor.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/Tresor.exe.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tresor-windows
          path: |
            dist/Tresor.exe
            dist/Tresor.exe.sha256

  release:
    name: Publish tagged Windows release
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          python scripts/check_release.py --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Release labels or tag mismatch' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Tresor-windows
          path: dist
      - name: Verify downloaded executable hash
        shell: pwsh
        run: |
          $expected = (Get-Content dist/Tresor.exe.sha256 -Raw).Trim()
          $actual = (Get-FileHash dist/Tresor.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Release artifact hash mismatch' }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/Tresor.exe
            dist/Tresor.exe.sha256
