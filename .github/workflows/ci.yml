name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the locked Ruff version
        run: |
          python -m pip install uv==0.12.1
          uv sync --locked --only-group lint
      - name: Check release labels
        run: python scripts/check_release.py
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest --cov=tresor --cov-report=term-missing
      - name: Verify envelope validation with optimized Python
        run: python -O -m pytest -q tests/test_vault.py -k "rejected_before or correct_credentials_open"

  build:
    name: Build Windows executable
    needs: [ lint, test ]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked release dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --locked --extra dev --python 3.12
      - name: Check canonical release version
        run: uv run --no-sync python scripts/check_release.py
      - name: Build executable
        run: uv run --no-sync python -m PyInstaller packaging/tresor.spec --clean --noconfirm
      - name: Check actual Windows version resource
        shell: pwsh
        run: |
          $version = uv run --no-sync python scripts/check_release.py
          $actual = (Get-Item dist/Tresor.exe).VersionInfo
          if ($actual.FileVersion -ne $version -or $actual.ProductVersion -ne $version) { throw 'Executable version mismatch' }
      - name: Compute SHA-256
        run: (Get-FileHash dist/Tresor.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/Tresor.exe.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tresor-windows
          path: |
            dist/Tresor.exe
            dist/Tresor.exe.sha256
      - name: Download the artifact with the tagged release workflow's reader
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tresor-windows
          path: ${{ runner.temp }}/tresor-roundtrip
      - name: Check the executable and its checksum after download
        shell: pwsh
        run: |
          $expected = (Get-FileHash dist/Tresor.exe -Algorithm SHA256).Hash
          $download = Join-Path $env:RUNNER_TEMP 'tresor-roundtrip'
          $actual = (Get-FileHash (Join-Path $download 'Tresor.exe') -Algorithm SHA256).Hash
          $declared = (Get-Content (Join-Path $download 'Tresor.exe.sha256') -Raw).Trim()
          if ($actual -ne $expected -or $declared -ne $expected) { throw 'Artifact roundtrip changed executable or checksum' }

  release:
    name: Publish tagged Windows release
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          python scripts/check_release.py --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Release labels or tag mismatch' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Tresor-windows
          path: dist
      - name: Verify downloaded executable hash
        shell: pwsh
        run: |
          $expected = (Get-Content dist/Tresor.exe.sha256 -Raw).Trim()
          $actual = (Get-FileHash dist/Tresor.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Release artifact hash mismatch' }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/Tresor.exe
            dist/Tresor.exe.sha256
